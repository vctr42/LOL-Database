[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Agendamento Cron para varredura contínua no Netlify (se ativado)
# Executa a cada 1 minuto durante janelas de campeonato
[functions."scan_matches"]
  schedule = "* * * * *"
